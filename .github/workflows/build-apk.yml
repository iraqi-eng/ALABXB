name: Build ALABXB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ALABXB source ZIP
        run: |
          mkdir -p build-source
          unzip -q "ALABXB-v0.1-branding-splash-v2.zip" -d build-source

      - name: Fix ALABXB Kotlin configuration
        run: |
          APP_DIR="build-source/ALABXB-v0.1/app"

          python3 - <<'PY'
          from pathlib import Path

          app = Path("build-source/ALABXB-v0.1/app/build.gradle.kts")
          text = app.read_text()

          old = 'kotlinOptions { jvmTarget = "17" }'
          new = '''kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }'''

          if old not in text:
              raise SystemExit("Expected kotlinOptions configuration was not found")

          app.write_text(text.replace(old, new))

          network = Path(
              "build-source/ALABXB-v0.1/app/src/main/java/"
              "com/alabxb/app/core/tools/network/NetworkIntelligenceTool.kt"
          )

          text = network.read_text()

          if "import kotlinx.coroutines.Dispatchers" not in text:
              text = text.replace(
                  "import kotlinx.coroutines.withContext",
                  "import kotlinx.coroutines.Dispatchers\n"
                  "import kotlinx.coroutines.withContext"
              )

          network.write_text(text)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build Debug APK
        working-directory: build-source/ALABXB-v0.1
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALABXB-APK
          path: build-source/ALABXB-v0.1/app/build/outputs/apk/debug/app-debug.apk
