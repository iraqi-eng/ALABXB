name: Build ALABXB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ALABXB source ZIP
        run: |
          mkdir -p build-source
          unzip -q "ALABXB-v0.1-branding-splash-v2.zip" -d build-source

      - name: Fix ALABXB Kotlin configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("build-source/ALABXB-v0.1")

          # Fix Kotlin/AGP configuration
          app = root / "app/build.gradle.kts"
          text = app.read_text()

          text = text.replace(
              '    id("org.jetbrains.kotlin.android")\n',
              ''
          )

          text = text.replace(
              '    kotlinOptions { jvmTarget = "17" }\n',
              '''    kotlin {
                compilerOptions {
                    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                }
            }
          '''
          )

          app.write_text(text)

          # Fix Dispatchers import in the correct Kotlin location
          network_tool = root / (
              "app/src/main/java/com/alabxb/app/core/tools/"
              "network/NetworkIntelligenceTool.kt"
          )

          network_text = network_tool.read_text()

          dispatchers_import = "import kotlinx.coroutines.Dispatchers\n"

          if dispatchers_import not in network_text:
              marker = "import kotlinx.coroutines.withContext\n"

              if marker in network_text:
                  network_text = network_text.replace(
                      marker,
                      dispatchers_import + marker,
                      1
                  )
              else:
                  raise RuntimeError(
                      "Could not find the coroutine import section "
                      "in NetworkIntelligenceTool.kt"
                  )

              network_tool.write_text(network_text)

          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build Debug APK
        working-directory: build-source/ALABXB-v0.1
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALABXB-APK
          path: build-source/ALABXB-v0.1/app/build/outputs/apk/debug/app-debug.apk
